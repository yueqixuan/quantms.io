# This workflow installs dependencies with uv, runs pre-commit, and tests.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    # Run full test suite daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --extra dev
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

  unit-tests:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --extra dev
      - name: Run unit tests
        run: uv run pytest -vv -m "not integration and not large_data"

  unit-tests-duckdb-floor:
    # Exercise the declared DuckDB floor (pyproject: duckdb>=1.1.3). On 1.1.3 a
    # plain CTE inlines, so the numbered_pg row-id join relies on AS MATERIALIZED;
    # this job guards that the floor actually works, not just the latest DuckDB.
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --extra dev
      - name: Pin DuckDB to the declared floor
        run: uv pip install "duckdb==1.1.3"
      - name: Show DuckDB version
        run: uv run python -c "import duckdb; print('duckdb', duckdb.__version__)"
      - name: Run unit tests on the DuckDB floor
        run: uv run pytest -vv -m "not integration and not large_data"
