# PEP 621 project metadata (used by uv, pip, and other standard tools)
[project]
name = "qpx"
version = "0.0.4"
description = "Convert multiple files into QPX format"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "BigBio Team", email = "ypriverol@gmail.com" }]
keywords = ["python", "multiomics", "proteomics", "quantms", "reanalysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "click>=8.1",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "pyopenms>=3.3.0,<3.5.0",
    "numpy>=1.24",
    "duckdb>=1.1.3,<=1.3.0",
    "pyyaml>=6.0",
]
[project.optional-dependencies]
mzidentml = ["lxml>=4.9.0"]
transforms = ["biopython", "mygene", "anndata"]
plotting = ["plotly>=5.0.0"]
all = ["lxml>=4.9.0", "biopython", "mygene", "anndata", "plotly>=5.0.0"]
dev = [
    "pytest",
    "pytest-timeout",
    "hypothesis",
    "lxml>=4.9.0",
    "anndata",
    "scikit-learn",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "markdown-exec[ansi]>=1.11.0",
]

[project.scripts]
qpxc = "qpx.cli.main:main"

[project.urls]
Repository = "https://github.com/bigbio/qpx"

[tool.poetry]
name = "qpx"
# The version will be dynamically read from __init__.py
version = "0.0.4"
description = "Convert multiple files into QPX format"
authors = ["BigBio Team <ypriverol@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/bigbio/qpx"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["python", "multiomics", "proteomics", "quantms", "reanalysis"]
include = [
    "LICENSE",
    "**/*.xml",
    "**/*.yaml",
    "qpx/core/ontology/data/*.parquet",
]

[tool.poetry.dependencies]
python = ">=3.10"
click = "*"
pandas = "*"
pyarrow = "*"
pyopenms = ">=3.3.0,<3.5.0"
numpy = "*"
duckdb = ">=1.1.3,<=1.3.0"
pyyaml = "*"
mygene = "*"
pyahocorasick = "*"
swifter = "*"
ddt = "*"
psutil = "*"
pyteomics = "*"
defusedxml = ">=0.7.1"
anndata = "*"
venn = "*"
plotly = ">=5.0.0"
scikit-learn = ">=1.5.0"
umap-learn = ">=0.5.0"
mokume = "*"
directlfq = "*"

# Optional dependencies (declared here so extras can reference them)
lxml = {version = ">=4.9.0", optional = true}
biopython = {version = "*", optional = true}

[tool.poetry.extras]
mzidentml = ["lxml"]
transforms = ["biopython"]
all = ["lxml", "biopython"]

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-timeout = "*"
hypothesis = "*"
anndata = "*"
scikit-learn = "*"
lxml = ">=4.9.0"
plotly = ">=5.0.0"

# Documentation
mkdocs = ">=1.5.0"
mkdocs-material = ">=9.0.0"
markdown-exec = {extras = ["ansi"], version = ">=1.11.0"}

[tool.poetry.scripts]
qpxc = "qpx.cli.main:main"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
pattern = "^(?P<base>\\d+\\.\\d+\\.\\d+)$"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "large_data: marks tests as requiring large data files (deselect with '-m \"not large_data\"')",
]